name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build client
        working-directory: client
        run: |
          npm install
          npm run build

      - name: Install & syntax-check server
        working-directory: server
        run: |
          npm install
          node --check src/index.js
